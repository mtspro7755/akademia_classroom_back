name: Laravel CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  tests:
    name: Run Laravel Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, gd, zip, pdo, mysql

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test


  deploy:
    name: Deploy to Server
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          envs: GH_TOKEN

          script: |

            cd /home/${{ secrets.SERVER_USER }}/domains/classroom.terangacode.com/public_html/akademia_classroom_back

            echo "Configuring Git authentication..."

            git remote set-url origin https://${GH_TOKEN}@github.com/kicos-organisation-project/akademia_classroom_back.git

            echo "Reset local changes..."

            git reset --hard
            git clean -fd

            echo "Pulling latest code..."

            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            echo "Installing dependencies..."

            composer install --no-dev --optimize-autoloader

            echo "Running migrations..."

            php artisan migrate --force

            echo "Generating Scramble API documentation..."

            php artisan scramble:export || true

            echo "Optimizing Laravel..."

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Deployment finished successfully"

        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
